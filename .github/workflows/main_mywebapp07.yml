# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions
#
# Free-tier deploy pipeline (Azure.md §11). No staging slots on F1, so:
#  * a deploy restarts the live app -> it is BLOCKED during NSE market hours unless forced;
#  * OIDC login is used when AZURE_CLIENT_ID is configured, else the publish profile.

name: Build and deploy Python app to Azure Web App - mywebapp07

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy even during market hours (restarts the live trading agent!)"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: mywebapp07

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Catch dependency and import errors before they reach the live app.
      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Smoke test - app imports and health endpoint responds
        run: |
          source antenv/bin/activate
          pip install httpx
          DATA_DIR="$(mktemp -d)" python -c "
          from fastapi.testclient import TestClient
          import main
          r = TestClient(main.app).get('/api/health/live')
          assert r.status_code == 200, r.text
          print('health:', r.json())
          "

      # Boot through startup.sh the way App Service does: plain interpreter with the build's
      # site-packages on PYTHONPATH (ahead of the stdlib). Catches shadowed-stdlib crashes
      # (e.g. fyers-apiv3's obsolete `asyncio` dependency) that the venv test above can't.
      - name: Smoke test - boot via startup.sh like App Service
        run: |
          SP=$(echo "$PWD"/antenv/lib/python3.*/site-packages)
          PYTHONPATH="$SP" APP_PATH="$PWD" PYTHON=python DATA_DIR="$(mktemp -d)" PORT=8000 \
            bash startup.sh > boot.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf localhost:8000/api/health/live; then echo; cat boot.log | grep '^startup:'; exit 0; fi
            sleep 1
          done
          echo "::error::App did not start via startup.sh"; cat boot.log; exit 1

      # Oryx (SCM_DO_BUILD_DURING_DEPLOYMENT=true) installs dependencies on the platform at
      # deploy time, so the local virtual environment is excluded from the artifact.
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/
            !data_files/
            !boot.log

  market-hours-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to restart the agent during NSE market hours
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          now=$(TZ=Asia/Kolkata date +%H%M); dow=$(TZ=Asia/Kolkata date +%u)
          echo "IST time $now, weekday $dow"
          if [ "$dow" -le 5 ] && [ "$now" -ge 0900 ] && [ "$now" -le 1535 ]; then
            if [ "$FORCE" = "true" ]; then
              echo "::warning::Forced deploy during market hours - the live agent will restart."
            else
              echo "::error::Deploys restart the trading agent. Re-run after 15:35 IST, or use 'Run workflow' with force=true."
              exit 1
            fi
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: [build, market-hours-guard]
    permissions:
      id-token: write   # OIDC
      contents: read
    env:
      HAS_OIDC: ${{ secrets.AZURE_CLIENT_ID != '' }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Azure login (OIDC)
        if: env.HAS_OIDC == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 'Deploy to Azure Web App (OIDC)'
        if: env.HAS_OIDC == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}

      - name: 'Deploy to Azure Web App (publish profile)'
        if: env.HAS_OIDC != 'true'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_4679289243E24ECEB13F4A937F2100C3 }}
