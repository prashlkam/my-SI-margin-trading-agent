# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions
#
# Free-tier deploy pipeline (Azure.md §11). Dependencies are built in GitHub Actions and
# shipped in the package (no Oryx build on Azure). No staging slots on F1, so:
#  * a deploy restarts the live app -> it is BLOCKED during NSE market hours unless forced;
#  * OIDC login is used when AZURE_CLIENT_ID is configured, else the publish profile.

name: Build and deploy Python app to Azure Web App - mywebapp07

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy even during market hours (restarts the live trading agent!)"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: mywebapp07

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      # Must match the App Service runtime (Python 3.11): numpy/pandas wheels are version-specific.
      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Dependencies are built HERE (free GitHub CPU) and shipped in the package, so App
      # Service never runs pip/Oryx - on the Free (F1) tier that work counts against the
      # app's CPU quota (Azure.md §2a). startup.sh puts this folder on PYTHONPATH.
      - name: Build dependencies into .python_packages
        run: |
          SITE=.python_packages/lib/site-packages
          python -m pip install --upgrade pip
          pip install --target "$SITE" -r requirements.txt
          # fyers-apiv3 pulls in the obsolete PyPI `asyncio==3.4.3` backport; on PYTHONPATH it
          # shadows the stdlib asyncio and crashes uvicorn. Never ship it.
          rm -rf "$SITE/asyncio"
          python -c 'import sys; print(f"{sys.version_info[0]}.{sys.version_info[1]}")' > .python_packages/PYTHON_VERSION
          echo "Python $(cat .python_packages/PYTHON_VERSION) packages: $(du -sh .python_packages | cut -f1)"

      # Boot through startup.sh exactly as App Service will: plain interpreter, no venv,
      # dependencies only from the shipped folder. Fails if startup.sh would reinstall.
      - name: Smoke test - boot via startup.sh like App Service
        run: |
          APP_PATH="$PWD" PYTHON=python DATA_DIR="$(mktemp -d)" PORT=8000 \
            bash startup.sh > boot.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf localhost:8000/api/health/live; then
              echo; grep '^startup:' boot.log
              if grep -q 'installing ONCE' boot.log; then
                echo "::error::startup.sh did not use the shipped packages"; exit 1
              fi
              exit 0
            fi
            sleep 1
          done
          echo "::error::App did not start via startup.sh"; cat boot.log; exit 1

      - name: Smoke test - app imports and health endpoint responds
        run: |
          python -m pip install httpx   # test-only; not shipped
          PYTHONPATH="$PWD/.python_packages/lib/site-packages" DATA_DIR="$(mktemp -d)" python -c "
          from fastapi.testclient import TestClient
          import main
          r = TestClient(main.app).get('/api/health/live')
          assert r.status_code == 200, r.text
          print('health:', r.json())
          "

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          include-hidden-files: true   # .python_packages and .deployment start with a dot
          path: |
            .
            !.git/
            !data_files/
            !boot.log

  market-hours-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to restart the agent during NSE market hours
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          now=$(TZ=Asia/Kolkata date +%H%M); dow=$(TZ=Asia/Kolkata date +%u)
          echo "IST time $now, weekday $dow"
          if [ "$dow" -le 5 ] && [ "$now" -ge 0900 ] && [ "$now" -le 1535 ]; then
            if [ "$FORCE" = "true" ]; then
              echo "::warning::Forced deploy during market hours - the live agent will restart."
            else
              echo "::error::Deploys restart the trading agent. Re-run after 15:35 IST, or use 'Run workflow' with force=true."
              exit 1
            fi
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: [build, market-hours-guard]
    permissions:
      id-token: write   # OIDC
      contents: read
    env:
      HAS_OIDC: ${{ secrets.AZURE_CLIENT_ID != '' }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Azure login (OIDC)
        if: env.HAS_OIDC == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 'Deploy to Azure Web App (OIDC)'
        if: env.HAS_OIDC == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}

      - name: 'Deploy to Azure Web App (publish profile)'
        if: env.HAS_OIDC != 'true'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_4679289243E24ECEB13F4A937F2100C3 }}
